name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build --nologo -c Release

      # The tests use an in-memory database and fakes for every AI provider: no database, key or network is needed.
      # Hundreds of in-process test servers each watch their config files; polling keeps the runner under Linux's inotify limit.
      - name: Test
        env:
          DOTNET_USE_POLLING_FILE_WATCHER: "true"
        run: dotnet test --nologo -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Keep test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore
