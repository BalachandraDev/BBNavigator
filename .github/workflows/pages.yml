name: Demo site

# Publishes the click-through demo to GitHub Pages. See "How the demo works" in the README.
on:
  push:
    branches: [main]
    paths:
      - "src/FlowMind.API/wwwroot/**"
      - "demo/**"
      - "scripts/build-pages.ps1"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build the demo site
        shell: pwsh
        run: ./scripts/build-pages.ps1 -Out _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
